name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Hard gates: the build fails if these fail ---
      - name: Format check (black)
        run: black --check . --exclude='/(venv|__pycache__|reports)/'

      - name: Unit tests (pytest)
        run: pytest -q

      # --- Informational: reported but non-blocking ---
      - name: Lint (flake8)
        run: flake8 . --exclude=venv,__pycache__,reports --max-line-length=100 || true

      - name: Code quality (pylint)
        run: pylint main.py data_loader.py trainer.py evaluator.py model_io.py --fail-under=7 || true

      - name: Security scan (bandit)
        run: bandit -r . -x ./venv,./__pycache__,./reports,./tests || true
